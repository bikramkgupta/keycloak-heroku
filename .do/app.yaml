name: keycloak-heroku
region: syd1

services:
  - name: keycloak
    github:
      repo: bikramkgupta/keycloak-heroku
      branch: app_platform
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    envs:
      # Keycloak admin configuration
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        scope: RUN_TIME
        value: "admin"
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        scope: RUN_TIME
        value: "change_me_in_production"

      # Database configuration (will be set by Phase B)
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${DATABASE_URL}
      - key: KC_DB
        scope: RUN_TIME
        value: "postgres"

      # Production Keycloak settings
      - key: KC_HOSTNAME_STRICT
        scope: RUN_TIME
        value: "false"
      - key: KC_HOSTNAME_STRICT_HTTPS
        scope: RUN_TIME
        value: "false"
      - key: KC_PROXY
        scope: RUN_TIME
        value: "edge"
      - key: KC_HEALTH_ENABLED
        scope: RUN_TIME
        value: "true"

      # App Platform specific
      - key: PORT
        scope: RUN_TIME
        value: "8080"